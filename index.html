<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="117 個繪圖提示詞，搭配範例圖片、分類搜尋與一鍵複製。"><title>靈感畫室｜繪圖提示詞圖鑑</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head>
<body><header><a class="brand" href="#">✳ 靈感畫室 <span>提示詞圖鑑</span></a><div class="tools"><button id="font" aria-label="放大字體">字體 A＋</button><button id="sound" aria-pressed="false">♫ 音效關</button></div></header>
<main><section class="intro"><div><p class="eyebrow">PROMPT EXPLORER · 把想像變成畫面</p><h1>你的下一張作品，<br><em>從一句靈感開始。</em></h1><p>探索風格、看看範例，複製提示詞開始創作。<br>每一張圖片，都是一種新可能。</p></div><div class="intro-art" aria-hidden="true"><span>✦</span><b>畫</b><i>✳</i><small>CREATE SOMETHING NEW</small></div></section>
<section class="workspace" aria-label="提示詞搜尋"><div class="searchline"><label class="search">⌕ <input id="search" type="search" placeholder="搜尋風格、主題或提示詞內容…" aria-label="搜尋提示詞"><kbd>/</kbd></label><button id="random" class="primary">✧ 隨機靈感</button></div><div id="categories" class="chips" aria-label="分類"></div><div class="filterline"><span id="count" role="status"></span><label><input type="checkbox" id="uploadOnly">需要參考圖</label><label><input type="checkbox" id="favoritesOnly">我的收藏</label><select id="sort" aria-label="排序"><option value="original">原始順序</option><option value="title">名稱排序</option></select></div></section>
<section id="grid" class="grid" aria-label="提示詞圖鑑"></section><div id="empty" hidden><h2>暫時找不到這個靈感</h2><p>換個關鍵字，或清除篩選再試試。</p><button id="reset">清除所有篩選</button></div><footer>範例圖片使用虛構主體。原始提示詞完整保留；範例設定另行標示。<a href="data/繪圖提示詞原始.txt" download>下載原始提示詞</a><a href="README.md">使用說明</a></footer></main>
<dialog id="detail"><button id="close" class="close" aria-label="關閉">×</button><div class="detail-grid"><div class="visual"><img id="large" alt=""><a id="download" download>↓ 下載範例圖片</a><div id="refBox"><p>模擬上傳的參考圖片</p><img id="refImage" alt="模擬參考圖"><a id="refDownload" download>下載參考圖</a></div></div><div class="detail-copy"><p id="detailCategory" class="eyebrow"></p><h2 id="detailTitle"></h2><p id="note" class="note"></p><h3>完整繪圖提示詞</h3><div id="prompt" class="prompt" tabindex="0"></div><div class="detail-actions"><button id="copy" class="primary">▣ 複製提示詞</button><button id="favorite">♡ 收藏</button></div><div class="prevnext"><button id="prev">← 上一個</button><span id="position"></span><button id="next">下一個 →</button></div><p class="hint">複製的是原始提示詞。需要圖片時，請在繪圖工具中另外上傳參考圖；此網頁提供範例瀏覽。</p></div></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="data/prompts.js"></script><script src="app.js"></script></body></html>
